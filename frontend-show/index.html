<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#04070f" />
    <script>
      // 首屏前确定主题,避免 FOUC;默认深邃(与裸 :root 一致)
      (function () {
        try {
          var t = localStorage.getItem("ccn.theme");
          if (t !== "dark" && t !== "dim" && t !== "light") t = "dark";
        } catch (e) {
          t = "dark";
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <title>高稳智能体 · 5GC 数字孪生平台</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
