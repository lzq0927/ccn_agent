[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ccn-agent"
version = "0.2.0"
description = "ReMAP AI-system reliability mechanism design and simulation with OpenCode"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.30.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.5.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "aiosqlite>=0.20.0",
    "mcp>=1.12,<2",
]

[project.scripts]
ccn-reliability = "reliability.cli:main"
ccn-reliability-mcp = "reliability.mcp_server:main"

[project.optional-dependencies]
browser = ["playwright>=1.50"]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
include = ["agents*", "simulator*", "tools*", "api*", "reliability*"]

[tool.setuptools.package-data]
reliability = ["knowledge/*.json", "knowledge/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
