<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>云核心网 · 用户级主动保障</title>
<style>
  :root{
    --bg:#f3f5fa; --card:#ffffff; --border:#e7eaf2; --border-soft:#eef1f7;
    --t1:#1e293b; --t2:#475569; --t3:#64748b;
    --primary:#2563eb; --primary-soft:#dbeafe; --srf:#7c3aed; --ue:#475569;
    --ok:#10b981; --warn:#f59e0b; --fault:#ef4444; --line:#aeb8c9;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 10px 30px rgba(16,24,40,.06);
    --shadow-sm:0 1px 2px rgba(16,24,40,.05);
    --radius:16px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font); color:var(--t1);
    background:
      radial-gradient(1200px 600px at 100% -10%, #e7ecfb 0%, rgba(231,236,251,0) 55%),
      radial-gradient(1000px 500px at -10% 110%, #eef0f7 0%, rgba(238,240,247,0) 50%),
      var(--bg);
    min-height:100vh; font-size:17px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  .gstats{display:flex;gap:10px;padding:10px 18px;border-bottom:1px solid var(--border-soft);}
  .gstat{flex:1;background:#fbfcfe;border:1px solid var(--border);border-radius:11px;padding:8px 12px;box-shadow:var(--shadow-sm);}
  .gstat .k{font-size:12px;color:var(--t3);}
  .gstat .v{font-size:18px;font-weight:720;color:var(--t1);margin-top:2px;}
  .gstat .v small{font-size:12px;color:var(--t2);font-weight:600;}

  .layout{display:grid;grid-template-columns:minmax(0,1fr) 640px;gap:16px;padding:16px 24px;align-items:stretch;}
  .card{background:var(--card);border:1.5px solid #d4dbe8;border-radius:var(--radius);box-shadow:var(--shadow);}
  .card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;border-bottom:1px solid var(--border-soft);}
  .card-head .title h2{margin:0;font-size:17px;font-weight:670;}
  .legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--t2);}
  .legend i{display:inline-block;width:22px;height:0;border-top:2.6px solid;margin-right:6px;vertical-align:middle;}
  .legend .dot{width:10px;height:10px;border-radius:50%;border:none;margin-right:5px;}

  /* 拓扑：拉满（svg 宽度铺满，viewBox 拉高填垂直） */
  .topo-wrap{display:flex;flex-direction:column;overflow:hidden;}
  .topo-scroll{flex:1 1 auto;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:10px;background:#fbfcfe;}
  .topo-scroll svg{width:100%;height:auto;}
  .t-node-label{font-size:26px;font-weight:680;fill:var(--t1);}
  .t-sn-name{font-size:24px;font-weight:680;fill:var(--t1);}
  .t-el-type{font-size:20px;font-weight:720;}
  .t-el-seq{font-size:16px;fill:var(--t3);font-weight:600;}
  .t-edge-label{font-size:22px;fill:#0f1724;font-weight:680;paint-order:stroke;stroke:#fff;stroke-width:7px;stroke-linejoin:round;}
  .edge{fill:none;stroke:var(--line);stroke-width:2.2;transition:stroke .25s,stroke-width .25s,opacity .25s;}
  .edge.dim{opacity:.2;}
  .edge.on{stroke:var(--primary);stroke-width:3.2;filter:drop-shadow(0 0 5px rgba(37,99,235,.5));}
  .edge.flow{stroke-dasharray:6 6;animation:flow 1.1s linear infinite;}
  @keyframes flow{to{stroke-dashoffset:-24;}}
  .user-path{fill:none;stroke:var(--primary);stroke-width:2.6;stroke-dasharray:6 6;opacity:0;transition:opacity .25s;filter:drop-shadow(0 0 3px rgba(37,99,235,.45));}
  .user-path.on{opacity:.9;}
  .subnet{transition:opacity .25s;}
  .subnet.dim{opacity:.3;}
  .subnet-frame{fill:rgba(255,255,255,.55);stroke:#b6c2d6;stroke-width:2.4;transition:stroke .25s,stroke-width .25s,filter .25s;}
  .subnet.sel .subnet-frame{stroke:var(--primary);stroke-width:3.4;filter:drop-shadow(0 0 6px rgba(37,99,235,.35));}
  .subnet.sel .t-sn-name{fill:var(--primary);}
  .el-node{transition:opacity .25s;}
  .el-halo{fill:none;stroke:var(--primary);stroke-width:3;opacity:0;}
  .el-node.on .el-halo{opacity:.7;animation:elpulse 1.6s ease-out infinite;}
  @keyframes elpulse{0%{r:30;opacity:.7;}100%{r:42;opacity:0;}}
  .el-bg{transition:stroke .25s;}
  .status-dot{stroke:#fff;stroke-width:2;}
  .node-base{transition:opacity .25s;}
  .node-base.dim{opacity:.35;}
  .node-base.on .ring{stroke-width:3.5;}

  /* 列表↔详情 之间的箭头 */
  .panel-arrow{display:flex;justify-content:center;align-items:center;height:36px;color:var(--primary);font-size:32px;font-weight:700;line-height:1;}

  /* 右侧面板（整体字号放大；去 sticky 让左右两列自然等高） */
  .panel{display:flex;flex-direction:column;gap:8px;padding-right:2px;}
  .user-list{max-height:168px;overflow:auto;padding:5px;}
  .user-list::-webkit-scrollbar{width:8px;} .user-list::-webkit-scrollbar-thumb{background:#e2e7f0;border-radius:8px;}
  .u-row{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;cursor:pointer;border:1px solid transparent;transition:background .15s,border-color .15s;}
  .u-row:hover{background:#f1f4fb;}
  .u-row.sel{background:var(--primary-soft);border-color:#bcd2fb;}
  .u-row .av{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;flex:none;}
  .u-row .nm{font-size:17px;font-weight:620;}
  .u-row .meta{font-size:14px;color:var(--t3);}
  .u-row .badge{margin-left:auto;font-size:13.5px;padding:3px 11px;border-radius:20px;font-weight:620;white-space:nowrap;}
  .badge.ok{background:#e7f7f1;color:#0f9b76;} .badge.warn{background:#fdf2e0;color:#b9791a;}
  .badge.fault{background:#fde8e8;color:#d23b3b;} .badge.guarded{background:#e0ecff;color:#235fdf;}
  .uidentity{padding:13px 16px;}
  .uid-line{font-size:16px;color:var(--t2);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .uid-line .d{width:12px;height:12px;border-radius:50%;flex:none;}
  .uid-line b{color:var(--t1);font-weight:660;}
  .sect{padding:12px 16px;border-top:1px solid var(--border-soft);}
  .sect h3{margin:0 0 10px;font-size:18.5px;font-weight:670;color:var(--t1);display:flex;align-items:center;gap:8px;}
  .sect h3 .tgroup{display:inline-flex;align-items:baseline;gap:7px;}
  .sect h3 .tw{margin-left:auto;}
  .sect h3 .hint{font-weight:500;color:var(--t3);font-size:14.5px;}
  .el-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .el-card{border:1px solid var(--border);border-radius:10px;padding:10px 13px;background:#fbfcfe;}
  .el-card .nm{font-size:17px;font-weight:660;display:flex;align-items:center;gap:7px;}
  .el-card .el-id{color:var(--t1);}
  .el-card .el-st{margin-left:auto;font-size:14.5px;font-weight:600;color:var(--t3);}
  .sdot{width:11px;height:11px;border-radius:50%;flex:none;}
  .sdot.ok{background:var(--ok);} .sdot.warn{background:var(--warn);} .sdot.fault{background:var(--fault);}
  .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;}
  .kpi{background:#fbfcfe;border:1px solid var(--border);border-radius:9px;padding:9px 6px;display:flex;align-items:baseline;gap:5px;justify-content:center;}
  .kpi .v{font-size:18px;font-weight:720;}
  .kpi .v.ok{color:var(--ok);} .kpi .v.warn{color:var(--warn);}
  .kpi .l{font-size:13.5px;color:var(--t3);}
  .tw{display:inline-flex;background:#f1f4fb;border-radius:9px;padding:3px;gap:2px;}
  .tw button{border:none;background:transparent;font:inherit;font-size:14.5px;font-weight:620;color:var(--t2);padding:5px 14px;border-radius:7px;cursor:pointer;}
  .tw button.on{background:#fff;color:var(--primary);box-shadow:var(--shadow-sm);}
  .chart-block{margin-top:10px;}
  .chart-block .ctitle{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:2px;}
  .chart-block .ctitle .t{font-size:16px;font-weight:620;color:var(--t2);}
  .chart-block .ctitle .big{font-size:19px;font-weight:720;color:var(--t1);}
  .chart-block .ctitle .big.ok{color:var(--ok);} .chart-block .ctitle .big.warn{color:var(--warn);}
  .chart-block svg.chart{width:100%;height:44px;display:block;}
  .caxis{display:flex;justify-content:space-between;font-size:13.5px;color:var(--t3);margin-top:2px;padding:0 2px;}
  .guard{margin-top:3px;border-radius:11px;padding:11px 13px;border:1px solid #cde0fd;background:linear-gradient(180deg,#f3f8ff,#eef4ff);}
  .guard.g-ok{border-color:#cdeedf;background:linear-gradient(180deg,#f2fbf6,#eafaf3);}
  .guard .gh{display:flex;align-items:center;gap:8px;font-size:19px;font-weight:680;color:var(--primary);}
  .guard.g-ok .gh{color:#0f9b76;}
  .guard .gdesc{font-size:16.5px;color:var(--t1);margin-top:5px;line-height:1.5;}
  .empty{padding:30px 20px;text-align:center;color:var(--t3);font-size:16.5px;}
  @media (max-width:1180px){.layout{grid-template-columns:1fr;}.panel{position:static;max-height:none;}}
</style>
</head>
<body>

<main class="layout">
  <section class="card topo-wrap">
    <div class="card-head">
      <div class="title"><h2>用户级保障全局拓扑</h2></div>
      <div class="legend">
        <span><i style="border-color:var(--line)"></i>上报/接入</span>
        <span><i style="border-color:var(--primary)"></i>选中用户保障链路</span>
        <span><span class="dot" style="background:var(--ok)"></span>正常</span>
        <span><span class="dot" style="background:var(--warn)"></span>预警</span>
        <span><span class="dot" style="background:var(--fault)"></span>故障</span>
      </div>
    </div>
    <div class="gstats" id="gstats"></div>
    <div class="topo-scroll">
      <svg id="topo" viewBox="0 0 1500 1050" preserveAspectRatio="xMidYMid meet" aria-label="核心网保障拓扑"></svg>
    </div>
  </section>

  <aside class="panel">
    <div class="card">
      <div class="card-head"><div class="title"><h2>用户终端</h2></div></div>
      <div class="user-list" id="userList"></div>
    </div>
    <div class="panel-arrow">▾</div>
    <div class="card" id="detail"><div class="empty">请在上方选择一个用户</div></div>
  </aside>
</main>

<script>
const SUBNETS = [
  { id:"sn1", name:"流量卡" },{ id:"sn2", name:"2B 低要求" },{ id:"sn3", name:"普通人网" },
  { id:"sn4", name:"VIP 高净值" },{ id:"sn5", name:"机器人" },{ id:"sn6", name:"2B 工厂" },
];
const FULL_SUBNETS = new Set(["sn1","sn4"]);
const EL_STATUS = { "AMF-1.1":"warn", "AMF-4.2":"warn", "SMF-3":"fault", "AMF-6":"warn" };
const SN_COLOR = { sn1:"#2563eb", sn2:"#10b981", sn3:"#8b5cf6", sn4:"#f59e0b", sn5:"#06b6d4", sn6:"#ec4899" };

function buildSubnetElements(){
  return SUBNETS.map((s,idx)=>{
    const full = FULL_SUBNETS.has(s.id);
    let els = full
      ? [{id:`AMF-${idx+1}.1`,type:"AMF",idx:0},{id:`AMF-${idx+1}.2`,type:"AMF",idx:1},
         {id:`SMF-${idx+1}.1`,type:"SMF",idx:0},{id:`SMF-${idx+1}.2`,type:"SMF",idx:1}]
      : [{id:`AMF-${idx+1}`,type:"AMF",idx:0},{id:`SMF-${idx+1}`,type:"SMF",idx:0}];
    els.forEach(e=>{ e.status = EL_STATUS[e.id] || "ok"; });
    return Object.assign({},s,{els,full,color:SN_COLOR[s.id]});
  });
}
const SUBNETS_FULL = buildSubnetElements();

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function genSeries(seed,n,base,amp,opt){
  opt=opt||{}; const r=mulberry32(seed); const out=[];
  for(let i=0;i<n;i++){
    let v = base + Math.sin(i/n*Math.PI*(opt.cyc||4)+(opt.ph||0))*amp*0.5 + (r()-0.5)*amp*(opt.noise||0.4);
    if(opt.dip){const d=Math.abs(i-opt.dip.at);if(d<=opt.dip.w){v-=opt.dip.drop*(1-d/(opt.dip.w+1));}}
    if(opt.clamp) v=Math.max(opt.clamp[0],Math.min(opt.clamp[1],v));
    out.push(+v.toFixed(2));
  }
  return out;
}

const USERS = [
  mkUser("UE-5012","巡检机器人","sn5","低时延",  "AMF-5","SMF-5", 1500, false, 6),
  mkUser("UE-4087","VIP 终端",  "sn4","尊享白金","AMF-4.1","SMF-4.2", 1287, true,  21),
  mkUser("UE-2304","政务专线",  "sn2","政企标准","AMF-2","SMF-2", 920, false, 5),
  mkUser("UE-1102","流量终端",  "sn1","流量套餐","AMF-1.1","SMF-1.1", 612, false, 3),
  mkUser("UE-1158","车载物联",  "sn1","流量套餐","AMF-1.2","SMF-1.2", 488, true,  44),
  mkUser("UE-4091","VIP 专线",  "sn4","尊享白金","AMF-4.2","SMF-4.1", 1440, false, 7),
  mkUser("UE-3301","大众终端",  "sn3","大众标准","AMF-3","SMF-3", 310, false, 9),
  mkUser("UE-3347","大众终端",  "sn3","大众标准","AMF-3","SMF-3", 402, true,  17),
  mkUser("UE-6104","产线 AGV",  "sn6","工业专网","AMF-6","SMF-6", 880, true,  33),
  mkUser("UE-6120","质检机械臂","sn6","工业专网","AMF-6","SMF-6", 760, false, 2),
];
function mkUser(id,name,sn,plan,amf,smf,throughput,guarded,seed){
  const snObj = SUBNETS_FULL.find(s=>s.id===sn);
  const amfEl = snObj.els.find(e=>e.id===amf);
  const smfEl = snObj.els.find(e=>e.id===smf);
  const base = guarded?99.2:99.4;
  const successH1 = genSeries(seed,12, base, guarded?0.6:0.4, guarded?{dip:{at:7,w:2,drop:8},clamp:[90,100],cyc:4}:{clamp:[98.9,100],cyc:5,noise:.3});
  const successH24= genSeries(seed+100,24, base, guarded?0.5:0.35, guarded?{dip:{at:14,w:3,drop:8.5},clamp:[90,100],cyc:4}:{clamp:[98.9,100],cyc:5,noise:.3});
  const trafficH1 = genSeries(seed+200,12, throughput*0.55, throughput*0.3, {clamp:[throughput*0.12, throughput*1.4],cyc:4});
  const trafficH24= genSeries(seed+300,24, throughput*0.7, throughput*0.38, {clamp:[throughput*0.1, throughput*1.5],cyc:3});
  const bizH1     = genSeries(seed+400,12, 38, 14, {clamp:[8,90],cyc:5}).map(Math.round);
  const bizH24    = genSeries(seed+500,24, 42, 20, {clamp:[6,110],cyc:4}).map(Math.round);
  return {
    id,name,subnet:sn,subnetName:snObj.name,subnetColor:snObj.color,
    iconKind: /机器人|AGV|机械臂/.test(name) ? "robot":"phone", plan,
    amf:{id:amf,status:amfEl.status}, smf:{id:smf,status:smfEl.status},
    sessions: 1+(seed%4), latency: 28+(seed%18), guarded,
    guard: guarded ? {at:"14:32",dur:"48s",drop:+Math.min(...successH1).toFixed(1),recover:successH1[successH1.length-1].toFixed(1)} : null,
    series:{"1h":{success:successH1,traffic:trafficH1,biz:bizH1,step:"5min"},"24h":{success:successH24,traffic:trafficH24,biz:bizH24,step:"1h"}}
  };
}
const GLOBAL = { onlineUE:"115,832", successRate:99.42, guarded:327, alerts:2 };

/* ===== 拓扑（viewBox 1500×1050，四层拉开填满） ===== */
const VB_W=1500, VB_H=1050, CX=750;
const AGENT={x:560,y:30,w:380,h:96,cx:750,cy:78};        // 底 126
const SRF  ={x:560,y:670,w:380,h:90,cx:750,cy:715};       // 顶670 底760
const UE   ={x:560,y:860,w:380,h:90,cx:750,cy:905};       // 顶860 底950
const SUB_Y_TOP=190, SUB_H=380, SUB_W=222, SUB_GAP=14;    // 190~570
const SUB_X0=(VB_W-(SUB_W*6+SUB_GAP*5))/2;                // 49
const EL_POS={};
function subnetBox(i){const x=SUB_X0+i*(SUB_W+SUB_GAP);return {x,y:SUB_Y_TOP,w:SUB_W,h:SUB_H,cx:x+SUB_W/2};}

const SVGNS="http://www.w3.org/2000/svg";
function el(name,attrs){const e=document.createElementNS(SVGNS,name);for(const k in attrs)e.setAttribute(k,attrs[k]);return e;}
const topo=document.getElementById("topo");

function buildDefs(){
  const defs=el("defs",{});
  const mk=(id,color)=>{const m=el("marker",{id,viewBox:"0 0 10 10",refX:"9",refY:"5",markerWidth:"8",markerHeight:"8",orient:"auto"});m.appendChild(el("path",{d:"M0,0 L10,5 L0,10 z",fill:color}));return m;};
  defs.appendChild(mk("arrow","#8a96a8"));
  defs.appendChild(mk("arrow-on","#2563eb"));
  topo.appendChild(defs);
}
function buildTopo(){
  buildDefs();
  const edgesG=el("g",{id:"edges"}); topo.appendChild(edgesG);
  SUBNETS_FULL.forEach((s,i)=>{
    const b=subnetBox(i); const ax=AGENT.x+60+i*((AGENT.w-120)/5);
    edgesG.appendChild(makeEdge(`e-up-${s.id}`,`M ${b.cx} ${b.y} C ${b.cx} ${b.y-50}, ${ax} ${AGENT.y+AGENT.h+50}, ${ax} ${AGENT.y+AGENT.h}`,`up-${s.id}`));
  });
  edgesG.appendChild(makeEdgeLabel(750,160,"KPI · CHR · 状态 · 用户行为 上报"));
  edgesG.appendChild(makeEdge("e-ue-srf",`M ${UE.cx} ${UE.y} L ${SRF.cx} ${SRF.y+SRF.h}`,"ue-srf"));
  edgesG.appendChild(makeEdge("e-ue-agent",`M ${UE.x} ${UE.cy} L 40 ${UE.cy} L 40 ${AGENT.cy} L ${AGENT.x} ${AGENT.cy}`,"ue-agent"));
  edgesG.appendChild(makeEdgeLabel(432,893,"用户建模"));
  edgesG.appendChild(makeEdge("e-agent-srf",`M ${AGENT.x+AGENT.w} ${AGENT.cy} L ${VB_W-40} ${AGENT.cy} L ${VB_W-40} ${SRF.cy} L ${SRF.x+SRF.w} ${SRF.cy}`,"agent-srf"));
  edgesG.appendChild(makeEdgeLabel(VB_W-60,(AGENT.cy+SRF.cy)/2,"根因感知","vert"));
  edgesG.appendChild(makeEdge("e-srf-sn","","srf-sn"));
  edgesG.appendChild(el("path",{id:"e-user-path",class:"user-path"}));

  const nodeG=el("g",{id:"nodes"}); topo.appendChild(nodeG);
  nodeG.appendChild(makeCoreNode("primary",AGENT,"高稳智能体","node-agent"));
  nodeG.appendChild(makeCoreNode("srf",SRF,"SRF · 分发层","node-srf"));
  nodeG.appendChild(makeCoreNode("ue",UE,"UE · 用户终端","node-ue"));
  SUBNETS_FULL.forEach((s,i)=>nodeG.appendChild(makeSubnet(s,i)));
}
function makeEdge(id,d,kind){return el("path",{id,d,class:"edge","data-kind":kind,"marker-end":"url(#arrow)"});}
function makeEdgeLabel(x,y,text,orient){
  const t=el("text",{x,y,class:"t-edge-label"});
  if(orient==="vert"){t.setAttribute("transform",`rotate(-90 ${x} ${y})`);t.setAttribute("text-anchor","middle");}
  else t.setAttribute("text-anchor","middle");
  t.textContent=text; return t;
}
function makeCoreNode(theme,box,title,id){
  const g=el("g",{id,class:"node-base","data-kind":id});
  const fill=theme==="primary"?"#2563eb":theme==="srf"?"#7c3aed":"#475569";
  const soft=theme==="primary"?"#eaf1fe":theme==="srf"?"#f1ecfd":"#eef2f7";
  g.appendChild(el("rect",{x:box.x,y:box.y,width:box.w,height:box.h,rx:18,fill:soft,stroke:fill,"stroke-width":3,class:"ring"}));
  g.appendChild(el("circle",{cx:box.x+68,cy:box.cy,r:36,fill}));
  drawIcon(theme,box.x+68,box.cy,g);
  const t1=el("text",{x:box.x+120,y:box.cy+9,class:"t-node-label"});t1.textContent=title;g.appendChild(t1);
  return g;
}
function drawIcon(theme,cx,cy,g){
  const s="#fff", sw=2.2;
  const P=(d)=>{g.appendChild(el("path",{d,fill:"none",stroke:s,"stroke-width":sw,"stroke-linecap":"round","stroke-linejoin":"round"}));};
  if(theme==="primary"){
    P(`M ${cx} ${cy-16} C ${cx-9} ${cy-17} ${cx-16} ${cy-11} ${cx-16} ${cy-3} C ${cx-16} ${cy+3} ${cx-12} ${cy+5} ${cx-11} ${cy+9} C ${cx-10} ${cy+14} ${cx-6} ${cy+15} ${cx} ${cy+14}`);
    P(`M ${cx} ${cy-16} C ${cx+9} ${cy-17} ${cx+16} ${cy-11} ${cx+16} ${cy-3} C ${cx+16} ${cy+3} ${cx+12} ${cy+5} ${cx+11} ${cy+9} C ${cx+10} ${cy+14} ${cx+6} ${cy+15} ${cx} ${cy+14}`);
    P(`M ${cx-15} ${cy-3} C ${cx-9} ${cy-2} ${cx-9} ${cy+2} ${cx-11} ${cy+6}`);
    P(`M ${cx+15} ${cy-3} C ${cx+9} ${cy-2} ${cx+9} ${cy+2} ${cx+11} ${cy+6}`);
    P(`M ${cx} ${cy-16} L ${cx} ${cy+14}`);
  }else if(theme==="srf"){
    g.appendChild(el("circle",{cx,cy:cy-14,r:3.4,fill:s}));
    [[cx-15,cy+11],[cx,cy+11],[cx+15,cy+11]].forEach(([x,y])=>g.appendChild(el("circle",{cx:x,cy:y,r:3.2,fill:s})));
    [[cx-15,cy+11],[cx,cy+11],[cx+15,cy+11]].forEach(([x,y])=>g.appendChild(el("line",{x1:cx,y1:cy-14,x2:x,y2:y,stroke:s,"stroke-width":sw,"stroke-linecap":"round"})));
  }else{
    g.appendChild(el("rect",{x:cx-11,y:cy-17,width:22,height:34,rx:4,fill:"none",stroke:s,"stroke-width":sw}));
    g.appendChild(el("line",{x1:cx-4,y1:cy-12,x2:cx+4,y2:cy-12,stroke:s,"stroke-width":sw,"stroke-linecap":"round"}));
    g.appendChild(el("circle",{cx,cy:cy+12,r:2.3,fill:s}));
  }
}
function makeSubnet(s,i){
  const b=subnetBox(i);
  const g=el("g",{class:"subnet","data-sn":s.id});
  g.appendChild(el("rect",{x:b.x,y:b.y,width:b.w,height:b.h,rx:16,fill:"rgba(255,255,255,.55)",stroke:"#b6c2d6","stroke-dasharray":"8 7",class:"subnet-frame"}));
  g.appendChild(el("path",{d:`M ${b.x} ${b.y+16} Q ${b.x} ${b.y} ${b.x+16} ${b.y} L ${b.x+b.w-16} ${b.y} Q ${b.x+b.w} ${b.y} ${b.x+b.w} ${b.y+16} L ${b.x+b.w} ${b.y+58} L ${b.x} ${b.y+58} Z`,fill:"#e8edf5"}));
  const nm=el("text",{x:b.cx,y:b.y+40,class:"t-sn-name","text-anchor":"middle"});nm.textContent="子网·"+s.name;g.appendChild(nm);
  g.appendChild(el("line",{x1:b.x+14,y1:b.y+60,x2:b.x+b.w-14,y2:b.y+60,stroke:"#d4dbe8","stroke-width":1}));
  const amfs=s.els.filter(e=>e.type==="AMF");
  const smfs=s.els.filter(e=>e.type==="SMF");
  drawElRow(g,smfs,b.y+155,b,s.full);  // SMF 上
  drawElRow(g,amfs,b.y+275,b,s.full);  // AMF 下
  g.style.cursor="pointer";
  g.addEventListener("click",()=>{const u=USERS.find(u=>u.subnet===s.id);if(u)selectUser(u.id);});
  return g;
}
function drawElRow(g,list,cy,b,full){
  list.forEach((e,idx)=>{const cx=full?(b.x+70+idx*82):(b.x+b.w/2);g.appendChild(drawEl(e,cx,cy));});
}
function drawEl(e,cx,cy){
  EL_POS[e.id]={cx,cy};
  const eg=el("g",{class:"el-node","data-el":e.id});
  const typeColor=e.type==="AMF"?"#2563eb":"#0ea5e9";
  const stColor=e.status==="warn"?"#f59e0b":e.status==="fault"?"#ef4444":typeColor;
  const fill=e.status==="fault"?"#fef2f2":e.status==="warn"?"#fffbeb":"#fff";
  eg.appendChild(el("circle",{cx,cy,r:40,class:"el-halo"}));
  eg.appendChild(el("circle",{cx,cy,r:34,fill,stroke:stColor,"stroke-width":2.8,class:"el-bg"}));
  const lab=el("text",{x:cx,y:cy+7,"text-anchor":"middle",class:"t-el-type",fill:stColor});lab.textContent=e.type;eg.appendChild(lab);
  if(e.id.includes(".")){const sq=el("text",{x:cx,y:cy+60,"text-anchor":"middle",class:"t-el-seq"});sq.textContent=e.id.split(".")[1];eg.appendChild(sq);}
  const sd=e.status==="ok"?"#10b981":e.status==="warn"?"#f59e0b":"#ef4444";
  eg.appendChild(el("circle",{cx:cx+24,cy:cy-24,r:9,fill:sd,class:"status-dot"}));
  return eg;
}

let currentUserId=null, currentWindow="1h";
function renderHighlight(){
  const u=USERS.find(x=>x.id===currentUserId);
  const edges=[...topo.querySelectorAll(".edge")];
  const elabels=[...topo.querySelectorAll(".t-edge-label")];
  const subnets=[...topo.querySelectorAll(".subnet")];
  const enodes=[...topo.querySelectorAll(".el-node")];
  const bases=[...topo.querySelectorAll(".node-base")];
  const userPath=topo.querySelector("#e-user-path");
  edges.forEach(e=>{e.classList.remove("on","dim","flow");e.setAttribute("marker-end","url(#arrow)");});
  elabels.forEach(l=>l.style.fill="");
  subnets.forEach(s=>s.classList.remove("sel","dim"));
  enodes.forEach(n=>n.classList.remove("on"));
  bases.forEach(n=>n.classList.remove("on","dim"));
  userPath.classList.remove("on"); userPath.setAttribute("d","");
  if(!u){ setSrfEdge("sn4",false); return; }
  const onKinds=new Set([`up-${u.subnet}`,"ue-srf","ue-agent","agent-srf","srf-sn"]);
  edges.forEach(e=>{const k=e.getAttribute("data-kind");if(onKinds.has(k)){e.classList.add("on","flow");e.setAttribute("marker-end","url(#arrow-on)");}else e.classList.add("dim");});
  elabels.forEach(l=>{l.style.fill="";});
  subnets.forEach(s=>{ if(s.getAttribute("data-sn")===u.subnet) s.classList.add("sel"); else s.classList.add("dim"); });
  enodes.forEach(n=>{ if(n.getAttribute("data-el")===u.amf.id||n.getAttribute("data-el")===u.smf.id) n.classList.add("on"); });
  bases.forEach(n=>n.classList.add("on"));
  setSrfEdge(u.subnet,true);
  const si=SUBNETS_FULL.findIndex(s=>s.id===u.subnet);
  const b=subnetBox(si);
  const ap=EL_POS[u.amf.id], sp=EL_POS[u.smf.id];
  if(ap&&sp){
    userPath.setAttribute("d",`M ${b.cx} ${b.y+b.h} L ${ap.cx} ${ap.cy} L ${sp.cx} ${sp.cy} L ${b.cx} ${b.y}`);
    userPath.classList.add("on");
  }
}
function setSrfEdge(snId,on){
  const edge=topo.querySelector("#e-srf-sn");
  const i=SUBNETS_FULL.findIndex(s=>s.id===snId);
  const b=subnetBox(i);
  const sx=SRF.cx, sy=SRF.y, tx=b.cx, ty=b.y+b.h;
  edge.setAttribute("d",`M ${sx} ${sy} C ${sx} ${sy-50}, ${tx} ${ty+50}, ${tx} ${ty}`);
  if(on){edge.classList.add("on","flow");edge.setAttribute("marker-end","url(#arrow-on)");}
  else {edge.classList.remove("on","flow");edge.setAttribute("marker-end","url(#arrow)");}
  let lab=topo.querySelector("[data-role='srf-sn-label']");
  if(!lab){lab=el("text",{class:"t-edge-label","data-role":"srf-sn-label","text-anchor":"middle"});topo.querySelector("#edges").appendChild(lab);}
  lab.setAttribute("x",(sx+tx)/2+74); lab.setAttribute("y",(sy+ty)/2+4);
  lab.textContent="最优恢复策略"; lab.style.fill="#0f1724";
}

function userIconSvg(kind){
  if(kind==="robot") return `<svg viewBox="0 0 24 24" width="62%" height="62%"><g fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="2" x2="12" y2="5"/><circle cx="12" cy="2.4" r="1.1" fill="#fff" stroke="none"/><rect x="5" y="6" width="14" height="13" rx="3.2"/><circle cx="9.4" cy="11.6" r="1.35" fill="#fff" stroke="none"/><circle cx="14.6" cy="11.6" r="1.35" fill="#fff" stroke="none"/><line x1="9.6" y1="15.6" x2="14.4" y2="15.6"/><line x1="3.5" y1="10" x2="5" y2="10"/><line x1="19" y1="10" x2="20.5" y2="10"/></g></svg>`;
  return `<svg viewBox="0 0 24 24" width="56%" height="56%"><g fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="3" width="10" height="18" rx="2.6"/><line x1="10.5" y1="18.4" x2="13.5" y2="18.4"/></g></svg>`;
}
function renderUserList(){
  const box=document.getElementById("userList"); box.innerHTML="";
  USERS.forEach(u=>{
    const row=document.createElement("div"); row.className="u-row"+(u.id===currentUserId?" sel":"");
    let badge;
    if(u.amf.status==="fault"||u.smf.status==="fault") badge=['fault','故障'];
    else if(u.amf.status==="warn"||u.smf.status==="warn") badge=['warn','预警'];
    else if(u.guarded) badge=['guarded','保障中'];
    else badge=['ok','健康'];
    row.innerHTML=`<div class="av" style="background:${u.subnetColor}">${userIconSvg(u.iconKind)}</div><div style="min-width:0"><div class="nm">${u.name}</div><div class="meta">${u.id} · ${u.subnetName}</div></div><span class="badge ${badge[0]}">${badge[1]}</span>`;
    row.addEventListener("click",()=>selectUser(u.id));
    box.appendChild(row);
  });
}
function renderDetail(){
  const box=document.getElementById("detail");
  const u=USERS.find(x=>x.id===currentUserId);
  if(!u){box.innerHTML=`<div class="empty">请在上方选择一个用户</div>`;return;}
  const w=currentWindow, S=u.series[w];
  const avgS=(S.success.reduce((a,b)=>a+b,0)/S.success.length).toFixed(2);
  const sumBiz=S.biz.reduce((a,b)=>a+b,0);
  const curT=S.traffic[S.traffic.length-1].toFixed(0), peakT=Math.max(...S.traffic).toFixed(0);
  const curS=S.success[S.success.length-1].toFixed(1), curBiz=S.biz[S.biz.length-1];
  const sCls = +curS<96?"warn":"ok";
  const axis = w==="1h"?["14:00","14:30","15:00"]:["昨 15:00","03:00","15:00"];
  const elCard=(role,id,status)=>{
    const st=status==="ok"?"健康":status==="warn"?"预警":"故障";
    return `<div class="el-card"><div class="nm"><span class="sdot ${status}"></span><span class="el-id">${role} · ${id}</span><span class="el-st">${st}</span></div></div>`;
  };
  box.innerHTML=`
    <div class="uidentity"><div class="uid-line"><span class="d" style="background:${u.subnetColor}"></span><b>${u.subnetName}</b> · ${u.plan} · 会话 ${u.sessions} · 时延 ${u.latency}ms</div></div>
    <div class="sect"><h3><span class="tgroup">接管网元状态</span></h3>
      <div class="el-grid">${elCard("AMF",u.amf.id,u.amf.status)}${elCard("SMF",u.smf.id,u.smf.status)}</div>
      <div class="kpi-row"><div class="kpi"><div class="v ${sCls}">${avgS}%</div><div class="l">成功率</div></div><div class="kpi"><div class="v">${sumBiz}</div><div class="l">业务</div></div><div class="kpi"><div class="v">${curT}</div><div class="l">流量</div></div><div class="kpi"><div class="v">${peakT}</div><div class="l">峰值</div></div></div></div>
    <div class="sect"><h3><span class="tgroup">业务与流量趋势 <span class="hint">历史 ${w==="1h"?"1 小时":"24 小时"}</span></span><span class="tw"><button data-w="1h" class="${w==="1h"?"on":""}">近 1h</button><button data-w="24h" class="${w==="24h"?"on":""}">近 24h</button></span></h3>
      ${chartBlock("业务成功率","%",S.success,"line",{min:88,max:100,color:"#10b981",cur:curS,curCls:sCls},axis)}
      ${chartBlock("流量使用","Mbps",S.traffic,"area",{color:"#2563eb",cur:curT},axis)}
      ${chartBlock("业务发起数","次",S.biz,"bar",{color:"#8b5cf6",cur:curBiz},axis)}</div>
    <div class="sect">${renderGuard(u)}</div>`;
  box.querySelectorAll(".tw button").forEach(btn=>btn.addEventListener("click",()=>{currentWindow=btn.dataset.w;renderDetail();}));
}
function chartBlock(title,unit,data,type,opt,axis){
  const curCls=opt.curCls||"";
  return `<div class="chart-block"><div class="ctitle"><span class="t">${title}</span><span class="big ${curCls}">${opt.cur}<small style="font-size:12px;color:var(--t3);font-weight:600"> ${unit}</small></span></div>${miniChart(data,type,opt)}<div class="caxis"><span>${axis[0]}</span><span>${axis[1]}</span><span>${axis[2]}</span></div></div>`;
}
function miniChart(data,type,opt){
  const W=384,H=40,padT=4,padB=10,padL=4,padR=4;
  const min=opt.min!=null?opt.min:0, max=opt.max!=null?opt.max:Math.max(...data)*1.12;
  const n=data.length, x=i=>padL+i*(W-padL-padR)/(n-1), yv=v=>padT+(H-padT-padB)*(1-(v-min)/(max-min||1));
  let body="";
  if(type==="line"||type==="area"){
    const pts=data.map((v,i)=>`${x(i)},${yv(v)}`).join(" ");
    if(type==="area") body+=`<polygon points="${padL},${H-padB} ${pts} ${W-padR},${H-padB}" fill="${opt.color}1f"/>`;
    body+=`<polyline points="${pts}" fill="none" stroke="${opt.color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
    body+=`<circle cx="${x(n-1)}" cy="${yv(data[n-1])}" r="3" fill="#fff" stroke="${opt.color}" stroke-width="2"/>`;
  }else{
    const bw=(W-padL-padR)/n*0.56;
    data.forEach((v,i)=>{const bx=x(i)-bw/2,by=yv(v),bh=(H-padB)-by;body+=`<rect x="${bx}" y="${by}" width="${bw}" height="${Math.max(bh,1)}" rx="2" fill="${opt.color}" opacity="${(0.5+0.5*(v-min)/(max-min||1)).toFixed(2)}"/>`;});
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="#e6eaf1" stroke-width="1"/>${body}</svg>`;
}
function renderGuard(u){
  if(u.guard){const g=u.guard;
    return `<div class="guard"><div class="gh">● 主动保障已生效</div><div class="gdesc">${g.at} 成功率跌至 <b>${g.drop}%</b>，智能体感知根因并经 SRF 分发最优恢复策略，<b>${g.recover}%</b> 恢复（用时 ${g.dur}）。</div></div>`;}
  return `<div class="guard g-ok"><div class="gh">● 健康 · 无需介入</div><div class="gdesc" style="color:var(--t2)">当前周期成功率稳定，智能体持续感知，暂未触发恢复策略。</div></div>`;
}
function renderGStats(){
  document.getElementById("gstats").innerHTML=`
    <div class="gstat"><div class="k">在线 UE</div><div class="v">${GLOBAL.onlineUE}</div></div>
    <div class="gstat"><div class="k">全网成功率</div><div class="v" style="color:var(--ok)">${GLOBAL.successRate}<small>%</small></div></div>
    <div class="gstat"><div class="k">主动保障中</div><div class="v" style="color:var(--primary)">${GLOBAL.guarded}<small> 用户</small></div></div>
    <div class="gstat"><div class="k">活跃预警</div><div class="v" style="color:var(--warn)">${GLOBAL.alerts}</div></div>`;
}
function selectUser(id){currentUserId=id;currentWindow="1h";renderUserList();renderDetail();renderHighlight();}
buildTopo(); renderGStats(); renderUserList(); renderHighlight(); selectUser("UE-4087");
</script>
